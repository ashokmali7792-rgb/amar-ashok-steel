<!DOCTYPE html>
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amar Ashok Steel</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5;color:#222}
header{background:#111;color:#fff;padding:18px 30px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:28px;font-weight:bold}
.hero{background:linear-gradient(135deg,#444,#999);color:#fff;text-align:center;padding:60px 20px}
.hero h1{font-size:42px;margin:0}
.hero p{font-size:18px}
.container{max-width:1200px;margin:auto;padding:30px}
.search{width:100%;padding:12px;font-size:16px;margin-bottom:25px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}
.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 3px 10px rgba(0,0,0,.15)}
.img{height:180px;background:#ddd;display:flex;align-items:center;justify-content:center;font-size:60px}
.info{padding:15px}
.price{color:#c62828;font-weight:bold}
button{width:100%;padding:10px;border:none;background:#111;color:#fff;border-radius:8px;cursor:pointer}
footer{background:#111;color:#fff;text-align:center;padding:20px;margin-top:40px}
</style>
</head>
<body>
<header>
<div class="logo">Amar Ashok Steel</div>
<div>Premium Kitchenware</div>
</header>

<section class="hero">
<h1>Premium Stainless Steel Kitchen Products</h1>
<p>Quality • Durable • Trusted</p>
</section>

<div class="container">
<input class="search" id="search" placeholder="Search products..." onkeyup="filterCards()">

<div class="grid" id="products"></div>
</div>

<footer>
<h3>Amar Ashok Steel</h3>
<p>Demo Website | Contact: +91 98765 43210</p>
</footer>

<script>
const names=[
"Steel Dinner Set","Steel Glass","Steel Katori","Steel Plate","Patila",
"Pressure Cooker","Storage Container","Tea Pot","Water Jug","Serving Bowl",
"Lunch Box","Spoon Set"
];
let html="";
for(let i=1;i<=120;i++){
 let name=names[i%names.length];
 html+=`
 <div class="card">
 <div class="img">🥣</div>
 <div class="info">
 <h3>${name} ${i}</h3>
 <p>Premium Stainless Steel</p>
 <p class="price">MRP ₹${199+i*15}</p>
 <button>View Details</button>
 </div>
 </div>`;
}
document.getElementById("products").innerHTML=html;

function filterCards(){
 const q=document.getElementById("search").value.toLowerCase();
 document.querySelectorAll(".card").forEach(c=>{
   c.style.display=c.innerText.toLowerCase().includes(q)?"block":"none";
 });
}
</script>
</body>
</html>
